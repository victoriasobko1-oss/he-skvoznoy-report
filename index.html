<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Сквозная отчетность | Магистратура</title>
<style>
:root {
  --bg: #f0f2f5;
  --panel: #ffffff;
  --line: #e3e6eb;
  --line-strong: #c9ced6;
  --text: #1f2328;
  --muted: #6b7280;
  --traffic: #fff1d6;
  --traffic-h: #ffe0a8;
  --micro: #e8f0fe;
  --micro-h: #d2e3fc;
  --grand: #dce0ea;
  --channel: #eef0f4;
  --filter: #fff8db;
  --accent: #2563eb;
  --hover: #f5f8ff;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 var(--font); }
.layout { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

.top {
  flex: 0 0 auto;
  background: var(--panel);
  border-bottom: 1px solid var(--line-strong);
  padding: 12px 16px 10px;
}
.top h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.meta { margin: 4px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.4; max-width: 1100px; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 8px;
}
.toolbar .group {
  display: grid; gap: 3px;
}
.toolbar label {
  font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em;
}
.toolbar input, .toolbar select {
  height: 30px; min-width: 0; padding: 0 8px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--filter); font: 12.5px/1 var(--font); color: var(--text);
}
.toolbar .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 220px; }
.toolbar .w-scale { width: 110px; }
.toolbar .w-utm { width: 120px; }
.toolbar .w-entry { width: 120px; }
.toolbar .w-channel { width: 140px; }
.toolbar .w-type { width: 140px; }
.toolbar .w-weeks { width: 90px; }
.toolbar .actions { display: flex; gap: 6px; margin-left: auto; }
.btn {
  height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px;
  background: #fff; font: 12px/1 var(--font); cursor: pointer; color: var(--text);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }

.hint, .banner {
  margin: 6px 0 0; padding: 7px 10px; border-radius: 6px; font-size: 12px; line-height: 1.35;
}
.hint { display: none; background: #fff6da; color: #7a5b00; border: 1px solid #f0d789; }
.banner { background: #f7f8fa; color: var(--muted); border: 1px solid var(--line); }

.sheet-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 12px 8px; }
table.sheet {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--panel);
  table-layout: fixed;
  font-size: 12.5px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  overflow: hidden;
}
table.sheet th, table.sheet td {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 0 6px;
  height: 28px;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
table.sheet th:last-child, table.sheet td:last-child { border-right: none; }

thead th {
  position: sticky; z-index: 5;
  font-size: 11px; font-weight: 600; text-align: center;
  color: #374151;
}
thead tr.group th { top: 0; height: 26px; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; }
thead tr.metrics th { top: 26px; height: 34px; font-size: 11px; font-weight: 600; line-height: 1.15; white-space: normal; }

.th-traffic { background: var(--traffic-h); }
.th-micro { background: var(--micro-h); }
.td-traffic { background: var(--traffic); }
.td-micro { background: var(--micro); }

.col-label { width: 18%; min-width: 180px; text-align: left !important; }
th.col-label, td.col-label {
  position: sticky; left: 0; z-index: 4; background: #fff;
  border-right: 1px solid var(--line-strong);
}
thead th.col-label { z-index: 6; background: #f3f4f6; text-align: left !important; padding-left: 10px; }

.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 12px;
}
.empty { color: #c4c9d1; }

tr.grand td { background: var(--grand) !important; font-weight: 700; }
tr.grand td.col-label { background: var(--grand) !important; }

tr.channel td { background: var(--channel); }
tr.channel td.col-label { background: var(--channel); font-weight: 600; }
tr.channel td.td-traffic { background: #f4e6c8; }
tr.channel td.td-micro { background: #d9e6fb; }
tr.channel:hover td { filter: brightness(0.985); }

tr.month td.col-label { padding-left: 28px; color: #374151; font-weight: 450; }
tr.month:hover td { background: var(--hover) !important; }

tr.hidden { display: none; }

.toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; margin-right: 6px; border-radius: 4px;
  border: 1px solid var(--line-strong); background: #fff; color: #111;
  font: 700 12px/1 var(--mono); cursor: pointer; vertical-align: middle;
}
.toggle:hover { border-color: var(--accent); color: var(--accent); }
.toggle[aria-expanded="true"] { background: #eff6ff; border-color: #93c5fd; color: var(--accent); }
.channel-name { vertical-align: middle; }

.status {
  flex: 0 0 auto;
  padding: 6px 16px;
  font-size: 11.5px;
  color: var(--muted);
  background: #f7f8fa;
  border-top: 1px solid var(--line);
}

@media (max-width: 1100px) {
  .toolbar .w-utm { width: 100px; }
  table.sheet { font-size: 12px; }
  .num { font-size: 11.5px; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
  <div class="top">
    <h1 id="title">Сквозная отчетность | Магистратура</h1>
    <div class="meta" id="meta"></div>

    <div class="toolbar">
      <div class="group">
        <label>Период</label>
        <div class="dates">
          <input type="date" id="dateFrom" title="От"/>
          <input type="date" id="dateTo" title="До"/>
        </div>
      </div>
      <div class="group">
        <label>Масштаб</label>
        <select id="scale" class="w-scale"></select>
      </div>
      <div class="group">
        <label>UTM Source</label>
        <select id="utmSource" class="w-utm"></select>
      </div>
      <div class="group">
        <label>UTM Medium</label>
        <select id="utmMedium" class="w-utm"></select>
      </div>
      <div class="group">
        <label>UTM Campaign</label>
        <select id="utmCampaign" class="w-utm"></select>
      </div>
      <div class="group">
        <label>UTM Content</label>
        <select id="utmContent" class="w-utm"></select>
      </div>
      <div class="group">
        <label>Точка входа</label>
        <select id="entry" class="w-entry"></select>
      </div>
      <div class="group">
        <label>Канал</label>
        <select id="channel" class="w-channel"></select>
      </div>
      <div class="group">
        <label>Тип кампаний</label>
        <select id="campaignType" class="w-type"></select>
      </div>
      <div class="group">
        <label>Недели</label>
        <input type="number" id="weeks" class="w-weeks" min="1" max="52" placeholder="выкл"/>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="expandAll">Раскрыть все</button>
        <button type="button" class="btn" id="collapseAll">Свернуть все</button>
      </div>
    </div>

    <div class="hint" id="hint"></div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="sheet-wrap">
    <table class="sheet" id="table">
      <thead>
        <tr class="group">
          <th class="col-label" rowspan="2">Канал / период</th>
          <th class="th-traffic" colspan="8">Трафик</th>
          <th class="th-micro" colspan="10">Микроконверсии</th>
        </tr>
        <tr class="metrics" id="metricHead"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
/** Short headers fit viewport; full name in title tooltip */
const COLS = [
  { key: 'spend', short: 'Расход', full: 'Расходы', kind: 'money', band: 'traffic' },
  { key: 'impressions', short: 'Показы', full: 'Показы', kind: 'int', band: 'traffic' },
  { key: 'clicks', short: 'Клики', full: 'Клики', kind: 'int', band: 'traffic' },
  { key: 'visits', short: 'Визиты', full: 'Визиты', kind: 'int', band: 'traffic' },
  { key: 'users', short: 'Посет.', full: 'Посетители кросс-девайс', kind: 'int', band: 'traffic' },
  { key: 'ctr', short: 'CTR', full: 'CTR', kind: 'pct', band: 'traffic' },
  { key: 'cpc', short: 'CPC', full: 'CPC', kind: 'money', band: 'traffic' },
  { key: 'cpu', short: 'CPU', full: 'CPU', kind: 'money', band: 'traffic' },
  { key: 'cr_form', short: 'CR формы', full: 'CR: визит → отправка формы', kind: 'pct', band: 'micro' },
  { key: 'form', short: 'Форма', full: 'Отправка Яндекс Формы', kind: 'int', band: 'micro' },
  { key: 'phone', short: 'Телефон', full: 'Клики по номеру телефона', kind: 'int', band: 'micro' },
  { key: 'plan', short: 'Уч.план', full: 'Смотрели учебный план', kind: 'int', band: 'micro' },
  { key: 'bot', short: 'Бот', full: 'Перешли в бот', kind: 'int', band: 'micro' },
  { key: 'sub', short: 'Подп.', full: 'Подписались на канал', kind: 'int', band: 'micro' },
  { key: 'cpa', short: 'CPA', full: 'CPA', kind: 'money', band: 'micro' },
  { key: 'bounce', short: 'Отказы', full: 'Отказы', kind: 'pct', band: 'micro' },
  { key: 'depth', short: 'Глубина', full: 'Глубина просмотра', kind: 'float', band: 'micro' },
  { key: 'time', short: 'Время', full: 'Время на сайте', kind: 'float', band: 'micro' },
];

const fmt = {
  int: v => Number(v).toLocaleString('ru-RU'),
  pct: v => {
    const n = Number(v);
    const p = n > 1 ? n : n * 100;
    return p.toFixed(1).replace('.', ',') + '%';
  },
  money: v => {
    const n = Number(v);
    if (Math.abs(n) >= 1000) return Math.round(n).toLocaleString('ru-RU');
    return n.toLocaleString('ru-RU', { maximumFractionDigits: 0 });
  },
  float: v => Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 1 }),
};

let DATA = null;
/** channel_key -> expanded */
const expanded = new Map();

function fillSelect(el, values, selected) {
  el.innerHTML = '';
  values.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    if (v === selected) o.selected = true;
    el.appendChild(o);
  });
}

function parseDate(s) {
  if (!s) return null;
  const d = new Date(s + 'T00:00:00');
  return Number.isNaN(d.getTime()) ? null : d;
}

function overlaps(aFrom, aTo, bFrom, bTo) {
  return aFrom <= bTo && aTo >= bFrom;
}

function daysAgo(n) {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - n);
  return d;
}

function filterRows(rows, f) {
  const from = parseDate(f.dateFrom);
  const to = parseDate(f.dateTo);
  const weeksOn = f.weeks !== '' && f.weeks != null && !Number.isNaN(Number(f.weeks));
  const weekCut = weeksOn ? daysAgo(Number(f.weeks) * 7) : null;
  const fullFrom = parseDate(DATA.meta.period.from);
  const fullTo = parseDate(DATA.meta.period.to);
  const fullRange = from && to && from.getTime() === fullFrom.getTime() && to.getTime() === fullTo.getTime();

  return rows.filter(r => {
    if (f.channel !== '(все)' && r.channel_key !== f.channel) return false;
    if (f.campaignType !== '(все)') {
      if (r.campaign_type === 'ALL') return false;
      if (r.campaign_type !== f.campaignType) return false;
    }
    if (r.row_kind === 'grand' && (f.channel !== '(все)' || f.campaignType !== '(все)')) return false;

    const rf = parseDate(r.date_from);
    const rt = parseDate(r.date_to);
    if (!rf || !rt || !from || !to) return false;

    if (r.row_kind === 'month') {
      if (!overlaps(rf, rt, from, to)) return false;
      if (weekCut && rt < weekCut) return false;
      return true;
    }
    if ((r.row_kind === 'total' || r.row_kind === 'grand') && !fullRange) return false;
    if (weeksOn && (r.row_kind === 'total' || r.row_kind === 'grand')) return false;
    return true;
  }).sort((a, b) => a.sort - b.sort);
}

/** Group filtered flat rows into {grand?, groups:[{total, months[]}]} */
function groupRows(rows) {
  const grand = rows.find(r => r.row_kind === 'grand') || null;
  const groups = [];
  let cur = null;
  rows.forEach(r => {
    if (r.row_kind === 'grand') return;
    if (r.row_kind === 'total') {
      cur = { total: r, months: [] };
      groups.push(cur);
      if (!expanded.has(r.channel_key)) expanded.set(r.channel_key, false);
    } else if (r.row_kind === 'month') {
      if (!cur || cur.total.channel_key !== r.channel_key) {
        // month without total (date filter) — synthetic header
        cur = {
          total: {
            ...r,
            row_kind: 'total',
            label: r.channel_key === '(все)' ? 'Все источники' : r.channel_key,
            spend: null, impressions: null, clicks: null, visits: null, users: null,
            ctr: null, cpc: null, cpu: null, cr_form: null, form: null, phone: null,
            plan: null, bot: null, sub: null, cpa: null, bounce: null, depth: null, time: null,
            _synthetic: true,
          },
          months: [],
        };
        groups.push(cur);
        if (!expanded.has(r.channel_key)) expanded.set(r.channel_key, true);
      }
      cur.months.push(r);
    }
  });
  return { grand, groups };
}

function cell(v, kind, band) {
  const td = document.createElement('td');
  td.className = 'num td-' + band;
  if (v == null || v === '') {
    td.classList.add('empty');
    td.textContent = '—';
    return td;
  }
  td.textContent = fmt[kind](v);
  td.title = String(v);
  return td;
}

function appendMetricCells(tr, row) {
  COLS.forEach(c => {
    const v = row._synthetic ? null : row[c.key];
    tr.appendChild(cell(v, c.kind, c.band));
  });
}

function renderMetricHead() {
  const tr = document.getElementById('metricHead');
  tr.innerHTML = '';
  COLS.forEach(c => {
    const th = document.createElement('th');
    th.className = c.band === 'traffic' ? 'th-traffic' : 'th-micro';
    th.textContent = c.short;
    th.title = c.full;
    tr.appendChild(th);
  });
}

function setExpanded(channelKey, value) {
  expanded.set(channelKey, value);
  document.querySelectorAll('tr.month[data-channel="' + CSS.escape(channelKey) + '"]').forEach(tr => {
    tr.classList.toggle('hidden', !value);
  });
  const btn = document.querySelector('button.toggle[data-channel="' + CSS.escape(channelKey) + '"]');
  if (btn) {
    btn.setAttribute('aria-expanded', value ? 'true' : 'false');
    btn.textContent = value ? '−' : '+';
  }
}

function render() {
  const f = {
    dateFrom: dateFrom.value,
    dateTo: dateTo.value,
    scale: scale.value,
    utmSource: utmSource.value,
    utmMedium: utmMedium.value,
    utmCampaign: utmCampaign.value,
    utmContent: utmContent.value,
    entry: entry.value,
    channel: channel.value,
    campaignType: campaignType.value,
    weeks: weeks.value,
  };

  const hints = [];
  if (f.scale !== 'Месяц') hints.push('Масштаб «' + f.scale + '»: в данных пока только месяцы.');
  if ([f.utmSource, f.utmMedium, f.utmCampaign, f.utmContent].some(x => x !== '(все)')) {
    hints.push('UTM пока не режет витрину.');
  }
  if (f.entry !== '(все)') hints.push('Точка входа ещё не пришита к Метрике.');
  hint.textContent = hints.join(' ');
  hint.style.display = hints.length ? 'block' : 'none';

  const filtered = filterRows(DATA.rows, f);
  const { grand, groups } = groupRows(filtered);
  tbody.innerHTML = '';

  if (!grand && !groups.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = COLS.length + 1;
    td.textContent = 'Нет строк под выбранные фильтры';
    td.style.padding = '16px';
    tr.appendChild(td);
    tbody.appendChild(tr);
    status.textContent = '0 строк';
    return;
  }

  if (grand) {
    const tr = document.createElement('tr');
    tr.className = 'grand';
    const label = document.createElement('td');
    label.className = 'col-label';
    label.textContent = grand.label;
    tr.appendChild(label);
    appendMetricCells(tr, grand);
    tbody.appendChild(tr);
  }

  groups.forEach(g => {
    const key = g.total.channel_key;
    const isOpen = expanded.get(key) === true;

    const tr = document.createElement('tr');
    tr.className = 'channel';
    const label = document.createElement('td');
    label.className = 'col-label';

    if (g.months.length) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toggle';
      btn.dataset.channel = key;
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      btn.setAttribute('aria-label', (isOpen ? 'Свернуть ' : 'Раскрыть ') + g.total.label);
      btn.textContent = isOpen ? '−' : '+';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setExpanded(key, !(expanded.get(key) === true));
      });
      label.appendChild(btn);
    }

    const name = document.createElement('span');
    name.className = 'channel-name';
    name.textContent = g.total.label;
    name.title = g.total.label;
    label.appendChild(name);
    tr.appendChild(label);
    appendMetricCells(tr, g.total);
    tr.addEventListener('click', () => {
      if (g.months.length) setExpanded(key, !(expanded.get(key) === true));
    });
    tbody.appendChild(tr);

    g.months.forEach(m => {
      const mtr = document.createElement('tr');
      mtr.className = 'month' + (isOpen ? '' : ' hidden');
      mtr.dataset.channel = key;
      const ml = document.createElement('td');
      ml.className = 'col-label';
      ml.textContent = m.label;
      mtr.appendChild(ml);
      appendMetricCells(mtr, m);
      tbody.appendChild(mtr);
    });
  });

  const openCount = [...expanded.values()].filter(Boolean).length;
  status.textContent = groups.length + ' каналов · раскрыто ' + openCount
    + ' · обновлено ' + (DATA.meta.updated_at || '—')
    + ' · наведи на заголовок колонки — полное имя';
}

function expandAll(open) {
  document.querySelectorAll('button.toggle').forEach(btn => {
    setExpanded(btn.dataset.channel, open);
  });
  // also mark keys without visible toggle
  expanded.forEach((_, key) => expanded.set(key, open));
  render();
}

async function boot() {
  renderMetricHead();
  const res = await fetch('data.json?_=' + Date.now());
  DATA = await res.json();
  title.textContent = DATA.meta.title;
  meta.textContent = [
    'Счётчик ' + DATA.meta.counter,
    DATA.meta.period.from + ' — ' + DATA.meta.period.to,
    DATA.meta.filter_note,
  ].join(' · ');

  banner.textContent = (DATA.meta.pending && DATA.meta.pending.length)
    ? ('В работе: ' + DATA.meta.pending.join('; '))
    : '';
  banner.style.display = banner.textContent ? 'block' : 'none';

  const d = DATA.dictionaries;
  dateFrom.value = DATA.meta.period.from;
  dateTo.value = DATA.meta.period.to;
  fillSelect(scale, d.scales, 'Месяц');
  fillSelect(utmSource, d.utm_source, '(все)');
  fillSelect(utmMedium, d.utm_medium, '(все)');
  fillSelect(utmCampaign, d.utm_campaign, '(все)');
  fillSelect(utmContent, d.utm_content, '(все)');
  fillSelect(entry, d.entry_points, '(все)');
  fillSelect(channel, d.channels, '(все)');
  fillSelect(campaignType, d.campaign_types, '(все)');

  ['dateFrom','dateTo','scale','utmSource','utmMedium','utmCampaign','utmContent','entry','channel','campaignType','weeks']
    .forEach(id => document.getElementById(id).addEventListener('input', render));
  expandAllBtn.addEventListener('click', () => expandAll(true));
  collapseAllBtn.addEventListener('click', () => expandAll(false));
  render();
}

boot().catch(err => {
  status.textContent = 'Не удалось загрузить data.json: ' + err.message;
});
</script>
</body>
</html>
